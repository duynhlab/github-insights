[project]
name = "github-insights"
version = "0.1.0"
description = "Engineering insights for the duynhlab GitHub org"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
gh-insights = "insights.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insights"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
