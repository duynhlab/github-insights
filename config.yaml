org: duynhlab

# Repo filter
repos:
  include: ["*"]
  exclude:
    - .github
    - action-test
    - pkg

# Bot identities. GitHub Apps (dependabot, AI reviewers, ...) are detected
# automatically via GraphQL __typename == Bot; list user accounts that act as bots here.
bots:
  - dependabot[bot]
  - renovate[bot]
  - github-actions[bot]
  - duynebot
  - copilot-swe-agent[bot]

# Time window for rolling metrics (days)
window_days: 90

# Stale thresholds (days without update)
stale_pr_days: 14
stale_issue_days: 30

# Output paths (relative to repo root)
paths:
  raw: data/raw
  processed: data/processed
  archive: data/archive
  state: data/state.json

# Rate-limit safety
rate_limit:
  min_core_remaining: 200
  min_graphql_remaining: 200
