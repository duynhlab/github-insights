name: collect-and-deploy

on:
  schedule:
    - cron: "0 */6 * * *"      # rolling refresh every 6h
    - cron: "0 3 * * 0"        # weekly full backfill + archive (Sunday 03:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "collect | all (collect+process+archive)"
        default: "all"
        type: choice
        options: [collect, process, archive, all]
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "web/**"
      - "config.yaml"
      - ".github/workflows/**"

concurrency:
  group: insights
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install collector
        working-directory: collector
        run: uv sync --frozen || uv sync

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            echo "cmd=all" >> $GITHUB_OUTPUT
          else
            echo "cmd=${{ inputs.mode || 'all' }}" >> $GITHUB_OUTPUT
          fi

      - name: Collect + process
        working-directory: collector
        env:
          GH_INSIGHTS_TOKEN: ${{ secrets.GH_INSIGHTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: uv run gh-insights ${{ steps.mode.outputs.cmd }} --config ../config.yaml

      - name: Commit data snapshot
        run: |
          git config user.name  "insights-bot"
          git config user.email "insights-bot@users.noreply.github.com"
          git add data/processed data/archive data/state.json || true
          git diff --cached --quiet || git commit -m "chore(data): refresh $(date -u +%FT%TZ)"
          git push || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          GH_PAGES_BASE: /github-insights
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - id: deployment
        uses: actions/deploy-pages@v5
