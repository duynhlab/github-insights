name: collect-and-deploy

on:
  schedule:
    - cron: "0 */6 * * *"      # rolling refresh every 6h
    - cron: "0 3 * * 0"        # weekly full backfill + archive (Sunday 03:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "collect | all (collect+process+archive)"
        default: "all"
        type: choice
        options: [collect, process, archive, all]
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/**"

concurrency:
  group: insights
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Runs the Python collector and commits a data snapshot. Skipped on web-only
  # pushes so UI changes don't burn GitHub API rate-limit.
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install collector
        working-directory: collector
        run: uv sync --frozen || uv sync

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            echo "cmd=all" >> $GITHUB_OUTPUT
          else
            echo "cmd=${{ inputs.mode || 'all' }}" >> $GITHUB_OUTPUT
          fi

      - name: Collect + process
        working-directory: collector
        env:
          GH_INSIGHTS_TOKEN: ${{ secrets.GH_INSIGHTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: uv run gh-insights ${{ steps.mode.outputs.cmd }} --config ../config.yaml

      - name: Commit data snapshot
        run: |
          git config user.name  "duynebot"
          git config user.email "duynebot@users.noreply.github.com"
          git add data/processed data/archive data/state.json
          git diff --cached --quiet || git commit -m "chore(data): refresh $(date -u +%FT%TZ)"
          # main may have moved while the collector ran (merged PRs); the data
          # commit only touches data/, so replaying it on top is safe.
          git pull --rebase origin main
          git push

  # Builds the Vite SPA against the latest data commit and deploys to Pages.
  # A push made with GITHUB_TOKEN never triggers another workflow, so deploy
  # must live in the same workflow and check out `main` after `collect` pushed.
  deploy:
    needs: collect
    if: always() && needs.collect.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          GH_PAGES_BASE: /github-insights
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
