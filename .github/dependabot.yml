version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      ui:
        patterns: ["radix-ui", "lucide-react", "recharts", "cmdk", "class-variance-authority"]

  - package-ecosystem: pip
    directory: /collector
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, collector]
